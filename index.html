<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7f2">
<title>人生大日子</title>
<meta name="description" content="记录人生中重要的日子，看看从那天起已经走了多远。">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="mast frame"><a href="/" class="wordmark"><span aria-hidden="true">✳</span> 大日子</a><button class="add" disabled>＋ 记一个日子</button></header>
<main class="frame">
<section class="timeline" aria-labelledby="timeline-title">
<div class="timeline-heading">
<h1 id="timeline-title">人生时间线<span aria-hidden="true">.</span></h1>
<p>把生命里重要的那一天，<br>留在这里。</p>
</div>
<p id="status" role="status">正在读取记录…</p>
<div class="timeline-stage">
<canvas id="ribbon" aria-hidden="true"></canvas>
<div id="rail" class="rail" aria-label="按日期排列的纪念日">
<ol id="events" class="track"></ol>
</div>
</div>
<div class="rail-footer"><p id="hint" hidden>点开一个节点，回到那一天</p><div id="rail-controls" hidden><button id="back" aria-label="浏览更早的日期">‹</button><button id="forward" aria-label="浏览更晚的日期">›</button></div></div>
</section>
</main>
<dialog id="detail" aria-labelledby="detail-title">
<div id="detail-year" aria-hidden="true"></div>
<article class="detail-page">
<header class="detail-bar"><button type="button" id="return" autofocus>× <span>返回时间线</span></button><button type="button" id="edit-event">编辑日子</button></header>
<div class="detail-content">
<time id="detail-date"></time>
<h2 id="detail-title"></h2>
<p id="detail-note" hidden></p>
<div class="elapsed"><p id="detail-duration"></p><p><strong id="detail-count"></strong> 天</p></div>
</div>
</article>
</dialog>
<dialog id="editor"><form id="event-form">
<div class="dialog-head"><h2 id="form-title">记一个日子</h2><button type="button" class="close" aria-label="关闭">×</button></div>
<label>事件名称<input name="title" required maxlength="60" placeholder="例如：我们结婚了"></label>
<label>日期<input name="day" type="date" required min="0001-01-01" max="9999-12-31"></label>
<label>想记下的话（可选）<textarea name="note" maxlength="500" rows="3"></textarea></label>
<p id="form-error" role="alert"></p>
<div class="dialog-actions"><button type="button" id="delete" hidden>删除事件</button><button class="primary" type="submit">保存日子</button></div>
</form></dialog>
</body>
</html>
