<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e0d6">
<title>Big Days</title>
<link rel="icon" type="image/png" sizes="132x132" href="/big-days-icon.png">
<meta name="description" content="记录人生中重要的日子，看看从那天起已经走了多远。">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="mast">
<a href="/" class="wordmark" lang="en"><img src="/big-days-icon.png" width="33" height="33" alt="">Big Days</a>
<div class="mast-actions"><button id="logout" class="add" type="button" hidden>退出登录</button><button class="add" id="add-event" type="button" lang="en" aria-label="Add a day" disabled><span aria-hidden="true">+</span> Add</button></div>
</header>
<main class="timeline-stage" aria-label="Big Days">
<div class="gallery-wall" aria-hidden="true"><div class="gallery-year"><span id="year-out"></span><span id="year-in"></span></div></div>
<section id="login-panel" class="login-panel" aria-labelledby="login-title" hidden>
  <h1 id="login-title">登录 Big Days</h1>
  <form id="request-code">
    <label for="login-email">邮箱</label>
    <input id="login-email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <button class="primary" type="submit">发送验证码</button>
  </form>
  <form id="verify-code" hidden>
    <label for="login-code">验证码</label>
    <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button class="primary" type="submit">登录</button>
  </form>
  <p id="login-message" role="status"></p>
</section>
<div id="rail" class="rail" tabindex="0" aria-label="按日期排列的纪念日，可左右滚动">
<ol id="events" class="track"></ol>
</div>
<p id="status" role="status" hidden></p>
<div id="rail-controls" hidden><button id="back" type="button" aria-label="浏览更早的日期">‹</button><button id="forward" type="button" aria-label="浏览更晚的日期">›</button></div>
</main>
<template id="selection-ink">
<svg class="selection-ink" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
<path d="M8 4 C21 2 31 3.6 46 3.1 S69 2.3 82 3.3 C91 3.6 96 2.7 96.8 8.4 C98.1 19 96.5 28 97 40 S98 64 96.8 77 C96.4 84 98.1 94 93 95.6 C84 98.3 71 96.5 57 97.1 S35 98.1 22 97 C13 96.1 4 98.7 3.5 92.5 C2 80 3.4 68 3.1 55 S2.1 34 3.4 21 C4.1 15 1.8 6.1 8 4 Z"/>
<path/>
</svg>
</template>
<dialog id="detail" aria-labelledby="detail-title">
<div id="detail-year" aria-hidden="true"></div>
<article class="detail-page">
<header class="detail-bar"><button type="button" id="return" autofocus>× <span>返回卡牌</span></button><button type="button" id="edit-event">编辑日子</button></header>
<div class="detail-content">
<time id="detail-date"></time>
<h2 id="detail-title"></h2>
<p id="detail-note" hidden></p>
<div class="elapsed"><p id="detail-duration"></p><p><strong id="detail-count"></strong> 天</p></div>
</div>
</article>
</dialog>
<dialog id="editor"><form id="event-form">
<div class="dialog-head"><h2 id="form-title">新增日期</h2><button type="button" class="close" aria-label="关闭">×</button></div>
<label>事件名称<input name="title" required maxlength="60" placeholder="例如：我们结婚了"></label>
<label>日期<input name="day" type="date" required min="0001-01-01" max="9999-12-31"></label>
<label>想记下的话（可选）<textarea name="note" maxlength="500" rows="3"></textarea></label>
<p id="form-error" role="alert"></p>
<div class="dialog-actions"><button type="button" id="delete" hidden>删除事件</button><button class="primary" type="submit">保存日子</button></div>
</form></dialog>
</body>
</html>
